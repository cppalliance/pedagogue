[package]
name = "teachpad-demo"
description = "A sample script player and a stand-in tutor that drive a TeachPad session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
teachpad-session.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `time` for the pause between steps, `macros` for `select!`. The caller
# picks the runtime.
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "test-util"] }

[lints]
workspace = true
