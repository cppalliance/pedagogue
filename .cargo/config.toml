# Link the Windows binary with the static CRT, so it runs on a machine that
# has no Visual C++ runtime installed. rust-lld ships in the toolchain and
# links several times faster than the stock MSVC linker; it resolves from the
# rustlib bin directory by name.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# `cargo installer` builds the installers of one target. See
# crates/pedagogue-installer.
[alias]
installer = "run -p pedagogue-installer --"

# Clippy appends a docs-link line to every diagnostic; the lint name already
# identifies it.
[env]
CLIPPY_DISABLE_DOCS_LINKS = "1"
